name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No secrets needed: tests/conftest.py pins LLM_PROVIDER=ollama and a
      # test JWT secret before anything imports config, and the suite never
      # calls a real Ollama, Gemini or OpenRouter endpoint - run_chat and the
      # query embedding are stubbed (see conftest.py's module docstring).
      - name: Run tests
        run: python -m pytest tests/
