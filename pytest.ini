[pytest]
# Only the test_*.py modules. tests/ also holds eval_golden.py and
# eval_quality.py, which are hand-run evaluation scripts needing a live model
# and an ingested corpus - not part of this suite.
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
