# Reference copy of the VPS's real nginx site config
# (/etc/nginx/sites-available/aeds-rag-assistant), kept here so a VPS rebuild
# has something to restore from instead of reconstructing it from memory -
# this file is not itself read by anything, it is documentation only.
#
# The `location ~ ^/(...)` list must be kept in sync with api/main.py's
# routers by hand: a path FastAPI serves but this regex doesn't match falls
# through to `location /`'s `try_files $uri /index.html` and silently
# returns the frontend's index.html instead of an API response. This exact
# mistake shipped once already - /version returned an empty response after
# deploy because "version" wasn't in this list yet.
#
# Re-run `certbot --nginx -d aeds-rag-assistant.ofurkan.co` after restoring
# this on a fresh host - the ssl_certificate lines point at
# /etc/letsencrypt/live/..., which only exists once certbot has issued (or
# re-issued) a certificate for that host.
#
# limit_req below needs a matching zone defined in the main nginx.conf's
# http{} block (not in this site file, and not restored by re-adding this
# file alone):
#   limit_req_zone $binary_remote_addr zone=aeds_rag:10m rate=10r/s;
# Measured directly with scripts/load_test.py against the live site
# (2026-09-29): at the original burst=20, a burst of 10 concurrent /health
# requests from one IP got real 503s back from nginx itself, before the
# request ever reached the app. burst=20 is tight enough that several
# students opening the assistant within the same second from one shared
# campus IP - each load firing a few rate-limited calls (guest auth,
# visitor count, chat) - could plausibly hit it too, the same scenario
# api/rate_limit.py's own comments already worried about for its
# per-identity limiters. Raised to burst=60 (rate=10r/s unchanged, so
# sustained-attack protection is the same) and reverified at 0 errors.
#
# gzip + the asset cache-control block (2026-10-05): the frontend build was
# being served completely uncompressed - the ~430KB JS bundle and ~68KB CSS
# bundle went out at their full, un-gzipped size on every single visit, with
# no Cache-Control either, so a returning visitor re-downloaded all of it
# again. That's the dominant cost on a mobile connection; a desktop's fast,
# low-latency link hid it. gzip_types deliberately excludes already-compressed
# formats (images, fonts) - gzipping those wastes CPU for zero size gain.
# Vite's hashed /assets/ filenames change on every build, so an immutable,
# year-long cache is safe there; index.html is exempted (no-cache, always
# revalidated) because it is what points at that build's hashes.

server {
    server_name aeds-rag-assistant.ofurkan.co;
    root /var/www/aeds-rag-assistant;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. No CSP here on purpose - the SPA's exact script/style
    # sourcing would need to be audited first to write one that doesn't break
    # the app; getting it wrong on a live site is worse than not having it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(chat|auth|admin|health|version|visitors) {
        limit_req zone=aeds_rag burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aeds-rag-assistant.ofurkan.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aeds-rag-assistant.ofurkan.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = aeds-rag-assistant.ofurkan.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aeds-rag-assistant.ofurkan.co;
    return 404; # managed by Certbot
}
