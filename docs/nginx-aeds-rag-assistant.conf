# Reference copy of the VPS's real nginx site config
# (/etc/nginx/sites-available/aeds-rag-assistant), kept here so a VPS rebuild
# has something to restore from instead of reconstructing it from memory -
# this file is not itself read by anything, it is documentation only.
#
# The `location ~ ^/(...)` list must be kept in sync with api/main.py's
# routers by hand: a path FastAPI serves but this regex doesn't match falls
# through to `location /`'s `try_files $uri /index.html` and silently
# returns the frontend's index.html instead of an API response. This exact
# mistake shipped once already - /version returned an empty response after
# deploy because "version" wasn't in this list yet.
#
# Re-run `certbot --nginx -d aeds-rag-assistant.ofurkan.co` after restoring
# this on a fresh host - the ssl_certificate lines point at
# /etc/letsencrypt/live/..., which only exists once certbot has issued (or
# re-issued) a certificate for that host.

server {
    server_name aeds-rag-assistant.ofurkan.co;
    root /var/www/aeds-rag-assistant;
    index index.html;

    client_max_body_size 50M;

    location ~ ^/(chat|auth|admin|health|version|visitors) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aeds-rag-assistant.ofurkan.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aeds-rag-assistant.ofurkan.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = aeds-rag-assistant.ofurkan.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aeds-rag-assistant.ofurkan.co;
    return 404; # managed by Certbot
}
